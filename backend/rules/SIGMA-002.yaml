id: SIGMA-002
title: Suspicious Encoded PowerShell Execution
severity: critical
description: Detects PowerShell execution with base64 encoded command or bypass flags.
tags:
- attack.execution
- attack.t1059.001
technique_id: T1059.001
logsource:
  category: process_creation
detection:
  selection:
    process_name:
    - powershell.exe
    - pwsh.exe
    command_line|contains:
    - -enc
    - -encodedcommand
    - downloadstring
    - iex
    - bypass
  condition: selection
